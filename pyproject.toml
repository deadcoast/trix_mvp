[project]
name = "trix"
version = "0.1.0"
description = "matrix agentic steering system"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "black>=24.4.2,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "sourcery>=1.14.0,<2.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.3.0",
    "ruamel.yaml>=0.17.32",
    "python-dateutil>=2.8.2",
    "tabulate>=0.9.0",
    "toml>=0.10.2",
    "attrs>=23.1.0",
    "freezegun>=1.2.2",
    "requests>=2.31.0",
    "urllib3>=2.0.4",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "colorama>=0.4.6",
    "platformdirs>=3.10.0",
    "packaging>=23.1",
    "pathspec>=0.11.2",
    "tomli>=2.0.1",
    "mypy-extensions>=1.0.0",
    "typing-extensions>=4.7.1",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "pydantic_core>=2.6.3",
    "typing-inspect>=0.9.0",
    "importlib-metadata>=6.8.0",
    "zipp>=3.16.2",
    "tomlkit>=0.12.1",
    "pygments>=2.16.1",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "pydantic_core>=2.6.3",
    "typing-inspect>=0.9.0",
    "importlib-metadata>=6.8.0",
    "tomlkit>=0.12.1",
    "types-requests>=2.31.0",
    "types-urllib3>=1.26.0",
    "types-python-dateutil>=2.8.0",
    "types-pytz>=2021.1",
    "types-setuptools>=65.0",
    "types-PyYAML>=6.0",
    "types-toml>=0.10.0",
    "types-attrs>=19.1.0",
    "types-freezegun>=1.1.0",
    "types-tabulate>=0.8.0",
    "types-pygments>=2.8.0"
]
classifiers = [
    "Programming Language :: Python :: 3.12.8",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://deadcoast.net"
Repository = "https://github.com/deadcoast/trix"
Issues = "https://github.com/deadcoast/trix/issues"

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true
skip-magic-trailing-comma = true
force-exclude = """
/(
    | docs
    | setup.py
)/
"""

[tool.isort]
py_version = 310
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = []
known_local_folder = []
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
lines_after_imports = 2
force_single_line = true
skip_glob = ["docs/*", "setup.py"]
filter_files = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = false
strict_optional = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = false
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
allow_untyped_globals = true
allow_redefinition = true
local_partial_types = false
implicit_reexport = true
strict_equality = true
show_error_context = false
show_column_numbers = false
show_error_codes = true
exclude = ["docs", "test", "tests"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=trix --cov-report=term-missing"
testpaths = ["tests"]

[tool.sourcery]
config = ".sourcery.toml"
cache = ".sourcery_cache"
enabled = true
exclude = ["tests/*"]
ignore = []
include = ["trix/*"]
max_line_length = 120
min_effort = "medium"
min_improvement = 0.1
no_line_breaks = true
processes = 4

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["trix*", "trix.*"]

[tool.setuptools.package-dir]
    "" = "src"

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
extend-exclude = ["docs", "test", "tests"]

[tool.ruff.lint]
select = ["F", "E"]
extend-select = ["W", "C90", "I", "N", "B", "A", "C4", "PERF", "RUF"]
ignore = ["I001"]
fixable = ["ALL"]
unfixable = []
    preview = true
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
      force-single-line = true
      force-sort-within-sections = false
      lines-after-imports = 2
known-first-party = []
known-local-folder = []
known-third-party = []
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.mccabe]
      max-complexity = 24

[tool.ruff.lint.pycodestyle]
      ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
      allow-star-arg-any = true
      ignore-fully-untyped = true

[tool.ruff.lint.pylint]
      max-args = 5
      max-branches = 12
      max-locals = 15
      max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
    skip-magic-trailing-comma = false
line-ending = "auto"
    preview = false
    docstring-code-format = true

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"
