# Operator coordinates for junction validation (guttered examples)
operators:
  - id: export_node
    rule: R001
    operator: "(+)"
    coords:
      - vlg: 28
        hlg: 06
      - vlg: "27->26"
        hlg: 06
      - vlg: "18->15"
        hlg: 06
      - vlg: "28->26"
        hlg: 16
      - vlg: "18->15"
        hlg: 16

