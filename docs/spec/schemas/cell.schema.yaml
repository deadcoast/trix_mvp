# TRIX Cell Schema v0.1
# Machine-readable schema for cell validation and code generation

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://trix.dev/schemas/cell/v0.1"
title: "TRIX Cell"
description: "A multi-facet capsule representing one slot in a TRIX matrix"

type: object
required:
  - cell_id
  - block
  - slot
  - kind

properties:

  # ════════════════════════════════════════════════════════════════
  # IDENTITY
  # ════════════════════════════════════════════════════════════════
  
  cell_id:
    type: string
    pattern: "^[A-Z0-9]{4}-[1-9]$"
    description: "Unique identifier in format {BLOCK}-{slot}"
    examples:
      - "TASK-5"
      - "DOCS-1"
      - "HUB0-9"

  block:
    type: string
    pattern: "^[A-Z0-9]{4}$"
    minLength: 4
    maxLength: 4
    description: "Parent matrix title (4-character)"
    examples:
      - "TASK"
      - "DOCS"
      - "CODE"

  slot:
    type: integer
    minimum: 1
    maximum: 9
    description: "Position 1-9 in reading order (left-to-right, top-to-bottom)"

  row:
    type: integer
    minimum: 1
    maximum: 3
    description: "Row position 1-3 (derived: ((slot-1) // 3) + 1)"

  col:
    type: integer
    minimum: 1
    maximum: 3
    description: "Column position 1-3 (derived: ((slot-1) % 3) + 1)"

  # ════════════════════════════════════════════════════════════════
  # CLASSIFICATION
  # ════════════════════════════════════════════════════════════════

  kind:
    type: string
    enum:
      - node
      - block_ref
      - 9ode_ref
      - super_ref
      - empty
    description: "Cell type determining interpretation"

  ref:
    type: string
    pattern: "^[A-Z0-9]{4}$"
    description: "Target matrix title (for *_ref kinds)"
    nullable: true

  path:
    type: string
    description: "Explicit file path to referenced matrix"
    nullable: true

  # ════════════════════════════════════════════════════════════════
  # FACETS
  # ════════════════════════════════════════════════════════════════

  facets:
    type: object
    description: "Multi-attachment content slots"
    additionalProperties:
      oneOf:
        - type: string
          description: "File path to facet content"
        - type: object
          properties:
            inline:
              type: boolean
              const: true
            content:
              type: string
          required:
            - inline
            - content
        - type: "null"
    properties:
      task:
        description: "Actionable work item (.task.md)"
      doc:
        description: "Documentation/narrative (.doc.md)"
      steer:
        description: "Agent constraints/instructions (.steer.md)"
      code:
        description: "Source code reference"
      config:
        description: "Configuration data (.yaml/.toml/.json)"
      log:
        description: "Execution history (.log.md)"
      metric:
        description: "Measurements/KPIs (.metric.yaml)"

  # ════════════════════════════════════════════════════════════════
  # STEERING METADATA
  # ════════════════════════════════════════════════════════════════

  status:
    type: string
    enum:
      - draft
      - active
      - blocked
      - done
      - archived
    default: draft
    description: "Current lifecycle state"

  priority:
    type: integer
    minimum: 1
    maximum: 5
    nullable: true
    description: "Priority level (1=highest, 5=lowest)"

  deps:
    type: array
    items:
      type: string
      pattern: "^[A-Z0-9]{4}-[1-9]$"
    default: []
    description: "Cell IDs that must be 'done' before this cell can proceed"

  tags:
    type: array
    items:
      type: string
    default: []
    description: "Free-form labels for filtering and grouping"

  owner:
    type: string
    nullable: true
    description: "Responsible entity (user or agent)"
    examples:
      - "@alice"
      - "agent:codegen"
      - "team:backend"

  # ════════════════════════════════════════════════════════════════
  # LINKS
  # ════════════════════════════════════════════════════════════════

  links:
    type: array
    default: []
    items:
      type: object
      required:
        - target
        - relation
      properties:
        target:
          type: string
          pattern: "^[A-Z0-9]{4}-[1-9]$"
          description: "Target cell ID"
        relation:
          type: string
          enum:
            - requires
            - produces
            - extends
            - see_also
            - blocks
          description: "Relationship type"

# ══════════════════════════════════════════════════════════════════
# EXAMPLES
# ══════════════════════════════════════════════════════════════════

examples:
  - # Node cell with facets
    cell_id: "TASK-5"
    block: "TASK"
    slot: 5
    row: 2
    col: 2
    kind: "node"
    facets:
      task: "nodes/TASK-5.task.md"
      steer: "nodes/TASK-5.steer.md"
    status: "active"
    priority: 2
    deps:
      - "ARCH-2"
    tags:
      - "mvp"
      - "parser"
    owner: "agent:codegen"
    links:
      - target: "CODE-5"
        relation: "produces"

  - # Block reference cell
    cell_id: "HUB0-1"
    block: "HUB0"
    slot: 1
    row: 1
    col: 1
    kind: "block_ref"
    ref: "DOCS"
    path: "blocks/DOCS.trix"
    facets: {}
    status: null
    deps: []
    tags: []
    links: []

  - # Empty cell
    cell_id: "TASK-9"
    block: "TASK"
    slot: 9
    row: 3
    col: 3
    kind: "empty"
    facets: {}
    status: null
    deps: []
    tags: []
    links: []

# ══════════════════════════════════════════════════════════════════
# DEFINITIONS (for reuse)
# ══════════════════════════════════════════════════════════════════

$defs:
  cell_id:
    type: string
    pattern: "^[A-Z0-9]{4}-[1-9]$"
    description: "Cell identifier format"

  titl:
    type: string
    pattern: "^[A-Z0-9]{4}$"
    minLength: 4
    maxLength: 4
    description: "4-character matrix title"

  slot:
    type: integer
    minimum: 1
    maximum: 9

  status:
    type: string
    enum:
      - draft
      - active
      - blocked
      - done
      - archived

  relation:
    type: string
    enum:
      - requires
      - produces
      - extends
      - see_also
      - blocks
